name: nusa_chat_example
description: "Example app of the nusa_chat plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  nusa_chat:
    path: ../
  url_launcher: ^6.3.3

  # Browser APIs, used by lib/embed.dart to talk to the page hosting the iframe.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  dartz: ^0.10.1

flutter:
  uses-material-design: true
